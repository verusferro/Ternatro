[project]
name = "balatro-tern"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lupa>=2.8",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "tern-sdk>=0.1.0",
]

[project.scripts]
balatro-tern = "balatro_tern.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["balatro_tern"]
